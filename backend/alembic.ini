[alembic]
script_location = alembic
prepend_sys_path = .

# A URL real de conexão é injetada dinamicamente em alembic/env.py a
# partir do nosso Settings (pydantic-settings) — nunca hardcoded aqui,
# para não duplicar a fonte de verdade da configuração (settings.py).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
