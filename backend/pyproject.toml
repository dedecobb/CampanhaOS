[project]
name = "campanhaos-backend"
version = "0.1.0"
description = "CampanhaOS - Backend API (FastAPI, Clean Architecture, Multi-tenant)"
requires-python = ">=3.12"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # --- Validação e configuração ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",  # necessário para pydantic.EmailStr

    # --- Banco de dados ---
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",              # driver async do PostgreSQL

    # --- Cache / Fila ---
    "redis>=5.1.0",
    "celery>=5.4.0",

    # --- Autenticação ---
    "python-jose[cryptography]>=3.3.0",   # geração/validação de JWT
    "passlib>=1.7.4",                     # hash de senha (orquestrador de algoritmos)
    # Pin explícito: passlib (sem atualização há anos) é incompatível com
    # bcrypt>=4.1, que removeu o atributo interno `__about__` que o passlib
    # usa para detectar a versão do backend. Sem esse pin, `pip install`
    # traria a versão mais recente do bcrypt e quebraria hash de senha em
    # runtime com "password cannot be longer than 72 bytes" mesmo para
    # senhas curtas (efeito colateral do fallback de auto-diagnóstico do
    # passlib, não um limite real da nossa senha).
    "bcrypt>=4.0.1,<4.1",

    # --- Observabilidade ---
    "sentry-sdk[fastapi]>=2.14.0",

    # --- Integrações externas ---
    # httpx era usado só pelo TestClient nos testes (por isso estava em
    # optional-dependencies.dev) — passou a ser dependência de PRODUÇÃO
    # de verdade a partir do MapboxGeocodingService, que faz chamadas HTTP
    # reais para a API do Mapbox. Sem essa mudança, a imagem de produção
    # (que só instala as dependências principais) não teria o pacote.
    "httpx>=0.27.0",

    # --- Webhooks de terceiros ---
    # Necessário para `request.form()` funcionar no FastAPI/Starlette —
    # o webhook do Twilio manda o corpo como form-urlencoded, não JSON
    # (diferente de todo outro endpoint do projeto até agora, todos JSON).
    # Sem esse pacote, `request.form()` levanta uma exceção que quebra o
    # webhook silenciosamente (só aparece no log do servidor, nunca numa
    # resposta HTTP com corpo explicativo).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",             # linter + formatter (substitui flake8+black+isort)
    "mypy>=1.11.2",            # checagem estática de tipos
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # erros, imports não usados, imports desordenados, upgrades de sintaxe, bugs comuns

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Todos os testes da sessão compartilham o MESMO event loop. Necessário
# porque o engine assíncrono do SQLAlchemy (src/infrastructure/database/
# session.py) é um objeto único e compartilhado, com um pool de conexões
# asyncpg — e conexões asyncpg ficam presas ao event loop em que foram
# criadas. Sem isso, o pytest-asyncio cria um loop novo por função de
# teste (padrão), e reusar uma conexão do pool entre loops diferentes
# quebra com "attached to a different loop".
#
# pytest-asyncio 1.x separa isso em DUAS configurações — fixtures e testes
# têm escopo de loop configurado independentemente. As duas precisam do
# mesmo valor, ou fixture e teste acabam em loops diferentes mesmo assim.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Necessário porque o nome do projeto (campanhaos-backend) não corresponde
# ao nome da pasta de código (src/) — sem isso, `pip install .` falha ao
# tentar descobrir sozinho o que deve empacotar.
packages = ["src"]
